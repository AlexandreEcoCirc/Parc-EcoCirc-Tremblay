<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parc EcoCirc Tremblay - Maquette 3D</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    html, body { margin:0; height:100%; background:#f4f2ee; font-family: Calibri, Arial, sans-serif; }
    model-viewer { width:100%; height:100%; }
    .mention { position:absolute; bottom:10px; width:100%; text-align:center; font-size:12px; color:#777; }
  </style>
</head>
<body>
  <model-viewer
    src="EcoCircTremblay3D.glb"
    alt="Parc EcoCirc Tremblay, maquette 3D"
    camera-controls
    auto-rotate
    auto-rotate-delay="3000"
    rotation-per-second="8deg"
    camera-orbit="45deg 60deg auto"
    environment-image="neutral"
    shadow-intensity="1"
    ar>
  </model-viewer>
  <div class="mention">Perspective 3D indicative, document non contractuel</div>
</body>
</html>
